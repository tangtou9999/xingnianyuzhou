<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星念宇宙">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="logo_V1.1.png">
<link rel="apple-touch-icon" href="apple-touch-icon_V1.1.png">
<title>星念宇宙</title>
<style>
:root{--bg:#050d2b;--panel:rgba(12,24,60,.92);--line:rgba(153,184,255,.22);--text:#edf3ff;--muted:#93a5d2;--blue:#76baff;--gold:#f5d68a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#142d69 0%,#0a1b47 36%,#050d2b 72%,#020719 100%)}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 2px #9fcaff55)}

.pill{border:1px solid rgba(143,177,255,.3);background:radial-gradient(circle at 30% 25%,#b7d7ff55,#294d91 35%,#0a1945 78%);border-radius:30px;padding:9px 13px;color:#e4eeff;font-size:12px;backdrop-filter:blur(12px);box-shadow:inset -5px -6px 12px #02071988,inset 3px 3px 8px #ffffff24,0 0 14px #477edc22}
.iconbtn{width:52px;height:52px;border:0;background:transparent;box-shadow:none;overflow:visible;display:grid;place-items:center;}
.settings{width:40px;height:40px;font-size:16px;border-color:rgba(143,177,255,.3);color:#e3edff;background:radial-gradient(circle at 30% 25%,#d5e4ff,#7898d8 24%,#263d76 65%,#08122e 100%)}

#universe{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;z-index:1;isolation:isolate}
.planet{position:absolute;display:flex;flex-direction:column;align-items:center;gap:9px;transform:translate(-50%,-50%) scale(var(--user-scale,1));transform-origin:center center;border:0;background:none;padding:0;max-width:140px;z-index:2;animation:float 6s ease-in-out infinite alternate;touch-action:none;user-select:none;-webkit-user-select:none;will-change:left,top,transform}
.planet-core{width:clamp(64px,14vw,104px);height:clamp(64px,14vw,104px);animation:planetPulse 4.5s ease-in-out infinite;border-radius:50%;position:relative;display:block;box-shadow:0 0 18px var(--glow),0 0 42px color-mix(in srgb,var(--glow) 60%,transparent),inset -10px -12px 22px #02071966,inset 7px 6px 17px #ffffff66;background:radial-gradient(circle at 33% 27%,#ffffffa8 0%,var(--planet) 28%,var(--planet) 58%,color-mix(in srgb,var(--planet) 45%,#07102d) 100%)}
.planet-core:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 32%,transparent);filter:blur(1px)}
.planet-name{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;letter-spacing:1.2px;color:#edf5ff;text-shadow:0 1px 3px #020719,0 0 10px #7faeff66;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.planet-meta{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;font-size:11px;font-weight:500;letter-spacing:.5px;color:#a9c8ff;text-shadow:0 1px 5px #000;margin-top:-5px}
.planet.done-look{opacity:.75;filter:saturate(.75)}
@keyframes float{0%{margin-top:-13px;margin-left:-5px}50%{margin-top:10px;margin-left:7px}100%{margin-top:-7px;margin-left:-3px}} 
@keyframes planetPulse{0%,100%{filter:brightness(.96);box-shadow:0 0 14px var(--glow),0 0 32px color-mix(in srgb,var(--glow) 55%,transparent),inset -10px -12px 22px #02071966,inset 7px 6px 17px #ffffff55}50%{filter:brightness(1.16);box-shadow:0 0 22px var(--glow),0 0 48px color-mix(in srgb,var(--glow) 70%,transparent),inset -10px -12px 22px #02071966,inset 7px 6px 17px #ffffff55}}
.empty{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);width:80%;text-align:center;color:#8094c8;line-height:1.9;font-size:14px;pointer-events:none}
.empty .glow{font-size:38px;display:block;color:#9ec9ff;text-shadow:0 0 24px #5b9dff;margin-bottom:8px}

.utility-sphere{position:relative;width:60px;height:62px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;overflow:visible}
.utility-core{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;box-shadow:inset -7px -8px 13px #020719aa,inset 4px 4px 10px #ffffff6b,0 0 18px #66aaff88;animation:utilityFloat 4.8s ease-in-out infinite,utilityGlow 3.2s ease-in-out infinite alternate}
.task-core{background:radial-gradient(circle at 30% 25%,#f3fcff 0%,#86dcff 13%,#387fda 39%,#15336f 72%,#06112e 100%);border:1px solid #9ad8ff88}
.task-core:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #72c8ff77;box-shadow:0 0 13px #55b8ff55}
.system-core{background:radial-gradient(circle at 30% 25%,#fff9df 0%,#f5d58b 12%,#c58d43 34%,#5b3c54 64%,#101b43 100%);border:1px solid #f5d68a99;box-shadow:inset -7px -8px 13px #020719aa,inset 4px 4px 10px #ffffff77,0 0 20px #f5d68a66}
.system-core:after{content:"";position:absolute;inset:-4px;border:1px solid #f5d68a55;border-radius:50%;box-shadow:0 0 12px #f5d68a55}
.orb-label{font-size:10px;line-height:1.1;color:#f4f8ff;text-shadow:0 1px 5px #000,0 0 8px #8bcaffaa;letter-spacing:.1px;white-space:nowrap;font-weight:650}.system-core .orb-label{color:#fff1c9;text-shadow:0 1px 5px #28170b,0 0 8px #f5d68a88}
.utility-count{position:absolute;top:0;right:-1px;min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:#8bd9ff;color:#06122d;font-size:10px;line-height:17px;font-weight:700;box-shadow:0 0 9px #7ad6ff88}
.small-task-core{width:43px!important;height:43px!important}
.task-sphere{width:54px;height:58px}
.plus-core{width:44px;height:44px;color:#f5fbff;font-size:27px;font-weight:300;background:radial-gradient(circle at 30% 25%,#fff 0%,#a6f4ff 13%,#45a6e8 34%,#1761ad 65%,#071633 100%);border:1px solid #a9edff99;box-shadow:inset -7px -8px 13px #020719aa,inset 4px 4px 10px #ffffff77,0 0 22px #51d4ff99}
.task-core .orb-label{font-size:9px}
.plus-core .orb-label{font-size:9px}
.system-core .orb-label{font-size:9px}

.sys-planet .planet-core{display:grid;place-items:center;animation:utilityGlow 3.2s ease-in-out infinite alternate}
.sys-planet .orb-label{font-size:12px;font-weight:650;pointer-events:none}

@keyframes utilityGlow{from{filter:brightness(.94)}to{filter:brightness(1.2)}}
@keyframes utilityFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(7px,-5px)}50%{transform:translate(2px,6px)}75%{transform:translate(-7px,-2px)}}
@media (prefers-reduced-motion:reduce){.utility-core {animation:none!important}}

.overlay{position:absolute;inset:0;background:#010719a8;backdrop-filter:blur(9px);z-index:10;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-height:88%;overflow:auto;background:linear-gradient(180deg,rgba(17,34,78,.98),rgba(5,13,39,.99));border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -18px 60px #0008}
.sheet.full-task{height:100%;max-height:100%;border-radius:0;border:0;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}.overlay.task-overlay{align-items:stretch}.overlay.task-overlay .sheet{margin:0;max-width:none}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet h2{font-size:20px;margin:0;font-weight:650}.close{border:0;background:#ffffff12;border-radius:50%;width:34px;height:34px;font-size:20px}
label{display:block;color:#a9b9e5;font-size:12px;margin:14px 0 7px}
input,textarea,select{width:100%;border:1px solid rgba(139,171,246,.24);border-radius:12px;background:#06112f;color:#f1f5ff;padding:12px 13px;outline:none}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#72aaff;box-shadow:0 0 0 3px #4e8eff20}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.primary{border:0;border-radius:12px;padding:13px 16px;background:linear-gradient(100deg,#5a9dff,#8a8bff);color:white;font-weight:650;width:100%;margin-top:18px;box-shadow:0 8px 24px #3979e833}
.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#ffffff09;color:#c5d5ff}
.danger{color:#ffaaa9;border-color:#ff777744}.muted{font-size:12px;color:#879bc9;line-height:1.7}.progress-wrap{height:8px;border-radius:9px;background:#ffffff14;overflow:hidden;margin:10px 0 7px}.progress-bar{height:100%;background:linear-gradient(90deg,#60c8ff,#9c9aff);border-radius:9px;box-shadow:0 0 12px #60c8ff88;transition:width .25s}
.progress-number{font-size:12px;color:#a8c6ff}.section-title{font-size:13px;color:#9db4e9;margin:22px 0 8px}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);background:#ffffff08;border-radius:12px;padding:11px 12px}.item strong{font-size:14px}.item p{font-size:12px;color:#9aaddb;margin:5px 0 0;line-height:1.6}.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:11px;color:#a9c6ff;margin-right:5px}
.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;border:1px solid var(--line);background:#ffffff08;border-radius:10px;padding:9px 5px;color:#aabbe6;font-size:12px}.tab.active{background:#6c9dff25;border-color:#77aaff;color:white}
.toast{position:absolute;z-index:30;bottom:70px;left:50%;transform:translateX(-50%);background:#182a54;border:1px solid #7299e555;padding:10px 16px;border-radius:20px;font-size:13px;white-space:nowrap;display:none;white-space:normal;max-width:88%}
.toast-act{margin-left:10px;border:1px solid #7299e5;background:#294d91;border-radius:12px;padding:3px 12px;color:#fff;font-size:13px}
.mini-btn{border:1px solid var(--line);background:#ffffff0b;border-radius:10px;padding:9px 11px;color:#d7e4ff}
.todo-card{border:1px solid #7898e344;background:linear-gradient(135deg,#172b50dd,#0b1735ee);border-radius:16px;padding:12px;margin:10px 0}
.todo-line{display:flex;align-items:flex-start;gap:9px;padding:10px 2px;border-bottom:1px solid #ffffff10;font-size:14px;line-height:1.5}
.todo-line:last-child{border-bottom:0}.todo-line input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;accent-color:#82baff}
.todo-line.done span{text-decoration:line-through;color:#7e91b7}
.sheet.note-page{height:100%;max-height:100%;border-radius:0;border:0;background:#050b1c;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px)}
.note-top{display:flex;align-items:center;gap:10px}
.note-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:16px;font-weight:600}
.note-top .primary{width:auto;margin:0;padding:9px 18px}.note-top .secondary{padding:9px 12px}
.note-area{flex:1;min-height:0;margin-top:6px;resize:none;border:0;border-top:1px solid #26375f;border-radius:0;background:transparent;padding:16px 2px;font-size:17px;line-height:1.95;box-shadow:none}
.note-area:focus{box-shadow:none}
.note-foot{font-size:11px;color:#6f84b5;text-align:right;padding-top:6px}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 12px);max-height:none;display:flex;flex-direction:column}
.sheet.tall>*{flex:none}
.sheet.tall #ideaText{flex:1 1 auto;min-height:150px}
.sheet.tall #ideaGoal{min-height:90px!important}
.sheet.tall #createSave{margin-top:14px}
.editor-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.editor-toolbar button{border:1px solid #34466f;background:#101d3a;color:#dce7ff;border-radius:9px;padding:8px 10px}
.editor-toolbar button:disabled{opacity:.35}
#app::before{content:"";position:absolute;inset:-15%;background:var(--ov,none);pointer-events:none;animation:ovMove 90s ease-in-out infinite alternate}
@keyframes ovMove{from{transform:translate3d(-3%,-2%,0) rotate(-5deg) scale(1.06)}to{transform:translate3d(3%,2%,0) rotate(5deg) scale(1.14)}}
@media (prefers-reduced-motion:reduce){#app::before{animation:none}}
.theme-select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #34466f;background:#101d3a;color:#dce7ff;font-size:15px}
.kw-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kw-chip{border:1px solid #34466f;background:#101d3a;color:#dce7ff;border-radius:16px;padding:5px 12px;font-size:13px}
textarea::placeholder,input::placeholder{color:rgba(145,165,210,.30)}
.muted.soft{color:#5f7199;opacity:.8}
@media(min-width:700px){.sheet{max-width:560px;border:1px solid var(--line);border-radius:24px;margin-bottom:24px}.overlay{align-items:center}.planet-core{width:100px;height:100px}}
@media(max-width:430px){.planet-name{font-size:14px;letter-spacing:.8px}.planet-core{filter:saturate(1.08)}}
</style>
</head>
<body>
<div id="app">
<canvas id="stars"></canvas>
<div id="universe"><div id="planetLayer"></div><div class="empty" id="empty"><span class="glow">✦</span>这里是你的私人宇宙<br>想到什么，就把它放进来。<br>不用现在就决定要不要行动。</div></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const colors=[['#58a9ff','#4e9df4'],['#a4e75a','#75d64d'],['#4fe0e5','#31c8d0'],['#d49bff','#a16bff'],['#ffbd76','#ff9b62'],['#ff83b5','#f35c9b'],['#e8e56b','#c8d84f'],['#ff7070','#ff5555'],['#8f9bff','#6f7dff'],['#5fe3a8','#34c98a']];
let planets=[],links=[],todos=[],selected=null,linkMode=false;
const sysPlanets = [
  {id:'__todo__', title:'任务星', isSystem:true, sysType:'todo', x:0.35, y:0.46, vx:(Math.random()-.5)*.0009, vy:(Math.random()-.5)*.0009, scale:1, depth:0.95, color:0, progress:15},
  {id:'__add__', title:'灵感星', isSystem:true, sysType:'add', x:0.5, y:0.54, vx:(Math.random()-.5)*.0009, vy:(Math.random()-.5)*.0009, scale:1, depth:1, color:2, progress:25},
  {id:'__settings__', title:'系统星', isSystem:true, sysType:'settings', x:0.65, y:0.46, vx:(Math.random()-.5)*.0009, vy:(Math.random()-.5)*.0009, scale:1, depth:0.95, color:4, progress:15}
];
try{
  const savedSys = JSON.parse(localStorage.getItem('star_mind_sys')||'{}');
  sysPlanets.forEach(sp=>{if(savedSys[sp.id]){sp.x=savedSys[sp.id].x??sp.x;sp.y=savedSys[sp.id].y??sp.y;sp.scale=1;}});
}catch(e){}
const allActive=()=>[...sysPlanets, ...active()];
const findAny=id=>sysPlanets.find(x=>x.id===id)||planets.find(x=>x.id===id);

let lastBackup=localStorage.getItem('star_mind_last_backup')||'';
try{todos=JSON.parse(localStorage.getItem('star_mind_todos')||'[]')}catch(e){todos=[]}
try{planets=JSON.parse(localStorage.getItem('star_mind_planets')||'[]');links=JSON.parse(localStorage.getItem('star_mind_links')||'[]')}catch(e){}
(()=>{const seen=new Set();planets.forEach(p=>{if(!p)return;if(!Number.isFinite(Number(p.depth)))p.depth=pickDepth();let c=Number(p.color);if(!Number.isInteger(c)||c<0||c>=colors.length||(seen.has(c)&&seen.size<colors.length)){p.color=pickColor();c=p.color}seen.add(c)})})();
planets.forEach(p=>{if(p){p.scale=1;delete p.scaleAt}});
planets.forEach(p=>{if(p&&Array.isArray(p.notes)&&p.notes.length>1)mergeNotes(p)});
planets.forEach(p=>{if(p&&p.done&&p.autoDone===undefined)p.autoDone=!!(p.steps&&p.steps.length&&p.steps.every(x=>x.done))});
const save=()=>{
 try{
  localStorage.setItem('star_mind_planets',JSON.stringify(planets));
  localStorage.setItem('star_mind_links',JSON.stringify(links));
  localStorage.setItem('star_mind_todos',JSON.stringify(todos));
  const sysState={};sysPlanets.forEach(sp=>sysState[sp.id]={x:sp.x,y:sp.y});
  localStorage.setItem('star_mind_sys',JSON.stringify(sysState));
  updateCounts();return true;
 }catch(e){toast('保存失败：浏览器存储空间可能不足，请先导出备份');return false}
};
const updateCounts=()=>{const t=$('todoCount'),c=$('completedCount');if(t){const n=todos.filter(x=>!x.done).length;t.textContent=n;t.style.display=n?'block':'none';}if(c)c.textContent=planets.filter(p=>p.done&&!p.abandoned).length};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>planets.filter(p=>p && p.done!==true && p.abandoned!==true && p.paused!==true);
const localStamp=iso=>{try{return new Date(iso).toLocaleString(undefined,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return iso||'时间未知'}};
function playSound(){sweep()}
let toastT;
function toast(s,act){const t=$('toast');t.textContent=s;
 if(act){const b=document.createElement('button');b.className='toast-act';b.textContent=act.label;b.onclick=()=>{act.fn();t.style.display='none'};t.appendChild(b)}
 t.style.display='block';clearTimeout(toastT);if(!(act&&act.sticky))toastT=setTimeout(()=>t.style.display='none',act?6000:2200)}
let pinchState=null;
function bindPinchZoom(){
 const layer=$('planetLayer');
 layer.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
   const target=e.target.closest('.planet');if(!target)return;
   const id=target.dataset.pid;if(!id)return;
   const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
   pinchState={id,dist:Math.hypot(dx,dy),scale:Number(findAny(id)?.scale||1)};
  }
 },{passive:true});
 layer.addEventListener('touchmove',e=>{
  if(!pinchState||e.touches.length!==2)return;
  const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
  const dist=Math.hypot(dx,dy),p=findAny(pinchState.id);if(!p)return;
  p.scale=Math.max(.55,Math.min(2.2,pinchState.scale*dist/pinchState.dist));p.scaleAt=Date.now();
  const el=layer.querySelector(`[data-pid="${pinchState.id}"]`),cc=el&&el.querySelector('.planet-core');if(cc)cc.style.width=cc.style.height=coreSize(p)+'px';
 },{passive:true});
 layer.addEventListener('touchend',()=>{if(pinchState){save();pinchState=null}},{passive:true});
}
function render(){
 if($('completedCount'))$('completedCount').textContent=planets.filter(p=>p.done&&!p.abandoned).length;
 if($('abandonedCount'))$('abandonedCount').textContent=planets.filter(p=>p.abandoned).length;
 const layer=$('planetLayer');layer.innerHTML='';
 $('empty').style.display=active().length?'none':'block';
 const box=$('universe').getBoundingClientRect(),w=box.width,h=box.height;
 allActive().forEach((p,i)=>{
   if(!p || !p.id) return;
   if(!Number.isFinite(Number(p.color))) p.color=i%colors.length;
   if(!Array.isArray(p.steps)) p.steps=[];if(!Number.isFinite(Number(p.depth)))p.depth=pickDepth();
   if(p.x==null||p.y==null){const a=(i*2.399)%6.283,r=.18+((i%4)*.075);p.x=Math.max(.13,Math.min(.87,.5+Math.cos(a)*r));p.y=Math.max(.14,Math.min(.84,.5+Math.sin(a)*r));}
   const L=lim(p,w,h);p.x=Math.max(L.x0,Math.min(L.x1,p.x));p.y=Math.max(L.y0,Math.min(L.y1,p.y));
   const [planet,glow]=colors[((Number(p.color)%colors.length)+colors.length)%colors.length]||colors[0];
   const b=document.createElement('button');b.className='planet'+(p.isSystem?' sys-planet':'');b.dataset.pid=p.id;b.style.left=(p.x*100)+'%';b.style.top=(p.y*100)+'%';b.style.animationDelay=(-i*.8)+'s';b.style.zIndex=String(2+Math.round(p.depth*10));b.style.opacity=(.62+.38*p.depth).toFixed(2);b.style.filter=p.depth<.5?`blur(${((.5-p.depth)*2).toFixed(1)}px) saturate(.85)`:'none';b.style.setProperty('--planet',planet);b.style.setProperty('--glow',glow);
   const size=coreSize(p);
   if(p.isSystem){
     let coreClass = p.sysType==='todo'?'task-core':p.sysType==='add'?'plus-core':'system-core';

const KW_STOP=['我想要','我想学','我想做','我想去','我想练','我想','我要','我准备','我打算','我需要','想要去','想去','想要','想学','想做','想练','想写','想玩','想吃','想看','想买','想卖','准备','打算','需要','今天','明天','后天','突然','但是','可是','不过','不知道','不确定','不清楚','怎么样','怎么才能','怎么','怎样','如何','为什么','哪里','哪儿','什么','能不能','可不可以','是不是','有没有','应该','可以','可能','一下','一些','一点','感觉','觉得','比较','特别','非常','然后','所以','因为','如果','或者','还是','以及','并且','而且','已经','正在','开始','继续','尝试','试试','看看','研究','了解','学习','练习','学会','最快','更好','才能','能够','自己','亲手','大概','好像','真的','其实','就是','还有','还要','帮我','给我','我们','你们','大家','现在','这么','那么','这样','那样','这个','那个'];
const KW_PART='的了吗呢吧啊呀把被也又很挺和跟与我你他她它';
const KW_WEAK=new Set(['好吃','好玩','好看','简单','方便','快速','便宜','有趣','不错','很好','好用','最好','比如','例如','一样','一起','这个','那个','这样','那样','一个','两个','一种','东西','事情','问题','时候','现在','以后','之前','今年','明年','周围']);
const KW_LEAD='去来在给让对从到是有会能要想做学练',KW_TAIL='去来了过着',KW_VERB='卖买赚学做玩吃写拍开找搜查用靠从到向往';
function vocabList(){let v=[];try{v=JSON.parse(localStorage.getItem('star_mind_vocab')||'[]')}catch(e){}return [...new Set([...v,...planets.map(p=>p.title)])].filter(w=>w&&w.length>=2&&w!=='新想法')}
function learnWord(w,body){if(!w||w.length<2||w.length>8||!body.includes(w))return;let v=[];try{v=JSON.parse(localStorage.getItem('star_mind_vocab')||'[]')}catch(e){}if(!v.includes(w)){v.push(w);try{localStorage.setItem('star_mind_vocab',JSON.stringify(v.slice(-300)))}catch(e){}}}
function extractKeywords(text){
 const raw=String(text||'').trim();if(!raw)return[];
 const cand=new Map(),add=(w,sc)=>{w=w.trim();if(w.length<2||w.length>8)return;if(KW_WEAK.has(w))sc-=20;cand.set(w,Math.max(cand.has(w)?cand.get(w):-99,sc))};
 vocabList().forEach(w=>{if(raw.includes(w))add(w,200+w.length)});
 const clean=raw.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'|');
 const hasStop=k=>KW_STOP.some(w=>k.includes(w))||[...k].some(c=>KW_PART.includes(c));
 for(let L=6;L>=2;L--){const seen={};for(let i=0;i+L<=clean.length;i++){const sub=clean.slice(i,i+L);if(sub.includes('|'))continue;seen[sub]=(seen[sub]||0)+1}
  for(const k in seen)if(seen[k]>=2&&!hasStop(k))add(k,100+k.length)}
 let t=clean;[...KW_STOP].sort((a,b)=>b.length-a.length).forEach(w=>{t=t.split(w).join('|')});
 t=t.replace(new RegExp('['+KW_PART+']','g'),'|');
 t.split('|').forEach((c,idx)=>{
  c=c.replace(/^[做弄搞买吃写看学开]?[一二两三几这那][个份件套次种点些款条本]/,'');
  while(c.length>=3&&KW_LEAD.includes(c[0]))c=c.slice(1);
  while(c.length>=3&&KW_TAIL.includes(c[c.length-1]))c=c.slice(0,-1);
  if(c.length<2)return;
  if(c.length>5){
   const parts=c.split(new RegExp('['+KW_VERB+']')).filter(x=>x.length>=2);
   if(parts.length>1){parts.forEach((x,k)=>add(x.slice(0,6),10-idx*.5-k));return}
   add(c.slice(0,4),8-idx*.5);add(c.slice(-4),6-idx*.5);return}
  add(c,10-Math.abs(c.length-3)-idx*.5)});
 const arr=[...cand.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]),out=[];
 arr.forEach(w=>{if(out.length<4&&!out.some(o=>o.includes(w)||w.includes(o)))out.push(w)});
 if(!out.length){const f=clean.replace(/\|/g,'').slice(0,4);return f.length>=2?[f]:[]}

  setTimeout(()=>{try{a.oscs.forEach(o=>o.stop());a.cut.stop();a.master.disconnect()}catch(e){}},3500)}}

const dragging=new Set();
function coreSize(p){return Math.round((p.isSystem?(p.sysType==='add'?58:54):(48+Math.round((p.progress||0)*.64)))*Math.max(.55,Math.min(2.2,Number(p.scale)||1)))}
function lim(p,w,h){
 const size=coreSize(p),sc=1,nameW=p.isSystem?0:Math.min(118,String(p.title||'').length*16);
 const hw=Math.max(size,nameW)/2*sc+22,hv=(size+(p.isSystem?0:27)+((p.steps||[]).length?13:0))/2*sc+22;
 return{x0:Math.min(.5,hw/w),x1:Math.max(.5,1-hw/w),y0:Math.min(.5,hv/h),y1:Math.max(.5,1-hv/h)};
}
let physicsLast=0,physicsFrame=0;
function collisionPlay(ts=0){
 physicsFrame=requestAnimationFrame(collisionPlay);scaleRecover();
 if(localStorage.getItem('star_mind_collision')==='off'||$('overlay').classList.contains('show')){physicsLast=0;return}
 const ps=allActive().filter(p=>p&&p.x!=null&&p.y!=null);
 const box=$('universe').getBoundingClientRect(),w=Math.max(1,box.width),h=Math.max(1,box.height);
 const dt=Math.min(.032,physicsLast?((ts-physicsLast)/1000):.016);physicsLast=ts;
 ps.forEach(p=>{
  if(!Number.isFinite(p.vx))p.vx=(Math.random()-.5)*.0009;
  if(!Number.isFinite(p.vy))p.vy=(Math.random()-.5)*.0009;
  if(dragging.has(p.id))return;
  const k=.45+.55*p.depth;p.x+=p.vx*dt*60*k;p.y+=p.vy*dt*60*k;p.vx*=.995;p.vy*=.995;
  const sp=Math.hypot(p.vx*w,p.vy*h);
  if(sp<.12){if(sp>1e-6){p.vx*=.12/sp;p.vy*=.12/sp}else{const a=Math.random()*6.283;p.vx=Math.cos(a)*.12/w;p.vy=Math.sin(a)*.12/h}}
  else if(sp>14){p.vx*=14/sp;p.vy*=14/sp}
  const L=lim(p,w,h);
  if(p.x<L.x0){p.x=L.x0;p.vx=Math.abs(p.vx)*.88}
  if(p.x>L.x1){p.x=L.x1;p.vx=-Math.abs(p.vx)*.88}
  if(p.y<L.y0){p.y=L.y0;p.vy=Math.abs(p.vy)*.88}
  if(p.y>L.y1){p.y=L.y1;p.vy=-Math.abs(p.vy)*.88}
 });
 for(let it=0;it<2;it++)for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
  const a=ps[i],b=ps[j],dx=(b.x-a.x)*w,dy=(b.y-a.y)*h,dist=Math.hypot(dx,dy);
  const ra=coreSize(a)/2,rb=coreSize(b)/2,min=ra+rb+9;
  if(dist>0&&dist<min){
   const wa=dragging.has(a.id)?0:1,wb=dragging.has(b.id)?0:1,tw=wa+wb;if(!tw)continue;
   const nx=dx/dist,ny=dy/dist,overlap=min-dist;
   a.x-=nx*overlap*wa/tw/w;b.x+=nx*overlap*wb/tw/w;
   a.y-=ny*overlap*wa/tw/h;b.y+=ny*overlap*wb/tw/h;
   const avx=wa?(a.vx||0)*w:0,avy=wa?(a.vy||0)*h:0,bvx=wb?(b.vx||0)*w:0,bvy=wb?(b.vy||0)*h:0;
   const rel=(bvx-avx)*nx+(bvy-avy)*ny;
   if(rel<0){
    const impulse=-(1.45)*rel/tw;
    if(wa){a.vx=(avx-impulse*nx)/w;a.vy=(avy-impulse*ny)/h}
    if(wb){b.vx=(bvx+impulse*nx)/w;b.vy=(bvy+impulse*ny)/h}bump(a,b,-rel);
   }
  }
 }
 const els={};document.querySelectorAll('.planet').forEach(e=>{els[e.dataset.pid]=e});
 ps.forEach(p=>{
  if(!dragging.has(p.id)){const L=lim(p,w,h);p.x=Math.max(L.x0,Math.min(L.x1,p.x));p.y=Math.max(L.y0,Math.min(L.y1,p.y))}
  const el=els[p.id];if(el){el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%'}
 });
}
starfield();{let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(starfield,250)})}bindPinchZoom();render();updateCounts();collisionPlay();
if(musicOn())setTimeout(()=>{if(!AC||AC.state!=='running')toast('轻触屏幕，星空的声音会响起')},1500);
document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden)AC.suspend();else{AC.resume();checkReminders()}}else if(!document.hidden)checkReminders()});
setInterval(checkReminders,20000);checkReminders();applyTheme();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',()=>save());
})();
</script>
